[project]
name = "ascii-rl-arena"
version = "0.1.0"
description = "Train an agent in the ASCII arena."
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/arena-py/Cargo.toml"
module-name = "arena"

[tool.uv]
# Rebuild the Rust module when Rust code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]
