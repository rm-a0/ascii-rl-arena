[project]
name = "ascii-rl-arena"
version = "0.1.0"
description = "Train an agent in the ASCII arena."
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2",
    "torch>=2.9",
    "tyro>=1.0.17",
]

[dependency-groups]
# A ready-made PPO, to check that the env is learnable.
baseline = ["stable-baselines3>=2.7"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/arena-py/Cargo.toml"
# The Rust code builds `arena._arena`. The Python package `arena` wraps it.
python-source = "crates/arena-py/python"
module-name = "arena._arena"

# CPU PyTorch: a small MLP trains faster on CPU, and the CPU wheel is much smaller.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# Install SB3 too: its run is the reference in the experiment.
default-groups = ["baseline"]
# Rebuild the Rust module when Rust code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pyright]
# Use the uv environment, where `uv sync` installs `arena`.
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
# The env module. Sort it with the project's own imports.
known-first-party = ["arena"]
